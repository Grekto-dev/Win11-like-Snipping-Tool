name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 install -y --no-install-recommends \
            python3-gi python3-gi-cairo python3-cairo gir1.2-gtk-3.0 gir1.2-gdkpixbuf-2.0 gir1.2-pango-1.0 \
            gir1.2-wnck-3.0 gir1.2-notify-0.7 librsvg2-common xdg-utils \
            tesseract-ocr tesseract-ocr-eng ffmpeg libzbar0 python3-xlib python3-qrcode python3-pil \
            xvfb dbus-x11 x11-utils xclip fakeroot dpkg-dev desktop-file-utils fonts-liberation
      - name: Compile
        run: python3 -m compileall -q captura
      - name: Tests
        timeout-minutes: 25
        run: |
          export NO_AT_BRIDGE=1 GTK_USE_PORTAL=0 CAPTURA_NO_ANIM=1
          xvfb-run -a -s "-screen 0 1920x1080x24" dbus-run-session -- python3 -X faulthandler -m unittest discover -s tests -v
      - name: Desktop entry
        run: desktop-file-validate data/captura.desktop
      - name: Package builds
        run: scripts/build-deb.sh
